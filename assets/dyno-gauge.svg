<svg
  viewBox="0 0 400 290"
  width="400"
  height="290"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>

  <title id="title">Dynamo Engineering Output</title>

  <desc id="desc">
    A gold engineering output gauge representing active build intensity.
  </desc>

  <defs>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A6D1F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FFE9A8"/>
    </linearGradient>

    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- Background -->

  <rect
    x="0"
    y="0"
    width="400"
    height="290"
    fill="#0D0D0D"
  />


  <!-- Gauge background -->

  <path
    d="M 30 210 A 170 170 0 0 1 370 210"
    fill="none"
    stroke="#262626"
    stroke-width="22"
    stroke-linecap="round"
  />


  <!-- Active gauge -->

  <path
    d="M 30 210 A 170 170 0 0 1 370 210"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-dasharray="437 534"
    filter="url(#glow)"
  >

    <animate
      attributeName="stroke-dasharray"
      from="0 534"
      to="437 534"
      dur="1.8s"
      fill="freeze"
    />

  </path>


  <!-- Gauge ticks -->

  <g
    stroke="#D4AF37"
    stroke-width="2"
    stroke-linecap="round"
  >

    <line
      x1="30"
      y1="210"
      x2="50"
      y2="210"
    />

    <line
      x1="62.5"
      y1="120.1"
      x2="78.6"
      y2="131.8"
    />

    <line
      x1="147.5"
      y1="48.3"
      x2="153.65"
      y2="67.3"
    />

    <line
      x1="252.5"
      y1="48.3"
      x2="246.35"
      y2="67.3"
    />

    <line
      x1="337.5"
      y1="120.1"
      x2="321.4"
      y2="131.8"
    />

    <line
      x1="370"
      y1="210"
      x2="350"
      y2="210"
    />

  </g>


  <!-- Needle -->

  <g>

    <line
      x1="200"
      y1="210"
      x2="318"
      y2="135"
      stroke="#D4AF37"
      stroke-width="4"
      stroke-linecap="round"
      filter="url(#glow)"
    >

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="-70 200 210"
        to="0 200 210"
        dur="1.8s"
        fill="freeze"
      />

    </line>


    <!-- Needle hub -->

    <circle
      cx="200"
      cy="210"
      r="9"
      fill="#D4AF37"
    />

    <circle
      cx="200"
      cy="210"
      r="4"
      fill="#0D0D0D"
    />

  </g>


  <!-- Status -->

  <text
    x="200"
    y="55"
    text-anchor="middle"
    font-family="JetBrains Mono, monospace"
    font-size="13"
    letter-spacing="3"
    fill="#8A8A8A"
  >
    IDLE
  </text>


  <!-- Primary label -->

  <text
    x="200"
    y="247"
    text-anchor="middle"
    font-family="JetBrains Mono, monospace"
    font-size="15"
    letter-spacing="3"
    fill="#E5E5E5"
  >
    ENGINEERING OUTPUT
  </text>


  <!-- Secondary label -->

  <text
    x="200"
    y="271"
    text-anchor="middle"
    font-family="JetBrains Mono, monospace"
    font-size="11"
    letter-spacing="2"
    fill="#D4AF37"
  >
    BUILD MODE : ACTIVE
  </text>

</svg>
